<script>
const D = {"kurve": [22.6, 22.9, 23.7, 24.9, 27.2, 29.6, 32.2, 36.4, 37.4, 34.4, 31.5, 30.2, 27.7, 26.9, 26.8, 27.5, 27.4, 29.4, 30.9, 32.3, 30.0, 26.5, 23.0, 22.8], "pad": 40, "sx": 27.826, "b": 720, "h": 300};
const svg = document.querySelector("svg"), tip = document.getElementById("tip"),
      dot = document.getElementById("dot"), cross = document.getElementById("cross");
const lo = Math.floor(Math.min(...D.kurve) / 5) * 5, hi = Math.ceil(Math.max(...D.kurve) / 5) * 5;
svg.addEventListener("mousemove", e => {
  const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) * D.b / r.width;
  const h = Math.max(0, Math.min(23, Math.round((mx - D.pad) / D.sx)));
  const x = D.pad + h * D.sx, y = D.h - D.pad - (D.kurve[h] - lo) * (D.h - 2 * D.pad) / (hi - lo);
  cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("opacity", 1);
  dot.setAttribute("cx", x); dot.setAttribute("cy", y); dot.setAttribute("opacity", 1);
  tip.style.left = (x / D.b * 100) + "%"; tip.style.top = (y / D.h * 100) + "%";
  tip.style.opacity = 1;
  tip.textContent = `${h}:00 Uhr · ${D.kurve[h].toFixed(1).replace(".", ",")} ct/kWh`;
});
svg.addEventListener("mouseleave", () => {
  tip.style.opacity = 0; dot.setAttribute("opacity", 0); cross.setAttribute("opacity", 0);
});
